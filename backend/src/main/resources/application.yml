server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/psicology}
    username: ${SPRING_DATASOURCE_USERNAME:psicology}
    password: ${SPRING_DATASOURCE_PASSWORD:psicology}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

app:
  jwt:
    secret: "change-me-in-production-use-a-long-random-secret-key-at-least-32-bytes"
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000
  storage:
    upload-dir: ./uploads

logging:
  level:
    org.hibernate.SQL: warn
