spring:
  datasource:
    url: jdbc:h2:mem:psicology_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: "test-secret-key-for-tests-must-be-long-enough-32-bytes-minimum"
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000
  storage:
    upload-dir: ./target/test-uploads
