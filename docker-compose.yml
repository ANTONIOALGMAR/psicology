services:
  postgres:
    image: postgres:16-alpine
    container_name: psicology-db
    environment:
      POSTGRES_DB: psicology
      POSTGRES_USER: psicology
      POSTGRES_PASSWORD: psicology
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psicology -d psicology"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: psicology-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/psicology
      SPRING_DATASOURCE_USERNAME: psicology
      SPRING_DATASOURCE_PASSWORD: psicology
      APP_STORAGE_UPLOAD_DIR: /app/uploads
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: psicology-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  backend_uploads:
