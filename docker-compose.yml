services:
  postgres:
    image: postgres:16-alpine
    container_name: psicology-db
    environment:
      POSTGRES_DB: psicology
      POSTGRES_USER: psicology
      POSTGRES_PASSWORD: psicology
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psicology -d psicology"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
