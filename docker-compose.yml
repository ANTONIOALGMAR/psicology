services:
  postgres:
    image: postgres:16-alpine
    container_name: psicology-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-psicology}
      POSTGRES_USER: ${POSTGRES_USER:-psicology}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-psicology}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-psicology} -d ${POSTGRES_DB:-psicology}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: psicology-backend
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/psicology}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-psicology}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-psicology}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-a-long-random-secret-key-at-least-32-bytes}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}
      APP_STORAGE_UPLOAD_DIR: /app/uploads
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build: ./frontend
    container_name: psicology-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  backend_uploads:
